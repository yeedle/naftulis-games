<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoopyJames</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        canvas {
            background-color: white;
        }
        h1 {
            font-family: Arial, sans-serif;
            color: #333;
            margin-bottom: 20px;
        }
        #modeButton {
            margin-bottom: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background-color: #4CAF50;
            color: white;
            transition: background-color 0.3s;
        }
        #modeButton:hover {
            background-color: #45a049;
        }
        .nav-links {
            margin-bottom: 20px;
        }
        .nav-links a {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .nav-links a:hover {
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <h1>PoopyJames</h1>
    <div class="nav-links">
        <a href="index.html">Bouncing Ball</a>
        <a href="chess.html">Chess</a>
    </div>
    <button id="modeButton">Grow Mode</button>
    <canvas id="gameCanvas"></canvas>
    <script type="module" src="./script.js"></script>
</body>
</html>
