<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoopyJames - Chess</title>
    <style>
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f0f0f0;
        font-family: Arial, sans-serif;
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      .nav-links {
        margin-bottom: 20px;
      }
      .nav-links a {
        margin: 0 10px;
        text-decoration: none;
        color: #333;
        font-weight: bold;
      }
      .nav-links a:hover {
        color: #4caf50;
      }
      .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .game-info {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
      }
      .status {
        font-size: 1.2em;
        font-weight: bold;
        color: #333;
      }
      .controls button {
        padding: 8px 16px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin: 0 5px;
      }
      .controls button:hover {
        background-color: #45a049;
      }
      #chessboard {
        background: white;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .promotion-dialog {
        display: flex;
        flex-direction: column;
        background: white;
        border: 2px solid #333;
        border-radius: 4px;
        z-index: 1000;
      }
      .promotion-dialog button {
        padding: 10px 20px;
        margin: 5px;
        border: none;
        background: #4caf50;
        color: white;
        cursor: pointer;
        font-size: 16px;
      }
      .promotion-dialog button:hover {
        background: #45a049;
      }
      #trainBtn {
        background-color: #4caf50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin: 5px;
      }
      #trainBtn:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
      }
      #trainBtn:hover:not(:disabled) {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <h1>PoopyJames</h1>
    <div class="nav-links">
      <a href="index.html">Bouncing Ball</a>
      <a href="chess.html">Chess</a>
    </div>
    <div class="game-container">
      <div class="game-info">
        <div class="status" id="status">White's turn</div>
        <div class="controls">
          <button id="resetBtn">New Game</button>
          <button id="undoBtn">Undo</button>
          <button id="trainBtn">Start Training</button>
        </div>
      </div>
      <canvas id="chessboard"></canvas>
    </div>
    <script type="module" src="./chess.js"></script>
  </body>
</html>
