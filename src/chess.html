<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles/main.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoopyJames - Chess</title>
  </head>
  <body
    class="m-0 flex flex-col justify-center items-center min-h-screen bg-gray-100 font-sans"
  >
    <h1 class="text-gray-800 mb-5">PoopyJames</h1>
    <div class="mb-5">
      <a
        href="index.html"
        class="mx-2.5 no-underline text-gray-800 font-bold hover:text-green-500"
        >Bouncing Ball</a
      >
      <a
        href="chess.html"
        class="mx-2.5 no-underline text-gray-800 font-bold hover:text-green-500"
        >Chess</a
      >
    </div>
    <div class="flex flex-col items-center gap-5">
      <div class="flex gap-5 mb-5">
        <div class="text-lg font-bold text-gray-800" id="status">
          White's turn
        </div>
        <div class="controls">
          <button
            class="px-4 py-2 bg-green-500 text-white border-none rounded cursor-pointer mx-1.5 hover:bg-green-600"
            id="resetBtn"
          >
            New Game
          </button>
          <button
            class="px-4 py-2 bg-green-500 text-white border-none rounded cursor-pointer mx-1.5 hover:bg-green-600"
            id="undoBtn"
          >
            Undo
          </button>
          <button
            class="px-4 py-2 bg-green-500 text-white border-none rounded cursor-pointer mx-1.5 hover:bg-green-600 disabled:bg-gray-400 disabled:cursor-not-allowed"
            id="trainBtn"
          >
            Start Training
          </button>
        </div>
      </div>

      <!-- AI Controls -->
      <div class="flex gap-4 mb-5">
        <!-- Temperature Control -->
        <div class="flex items-center gap-2">
          <label for="temperatureSelect" class="text-gray-800 font-medium"
            >AI Randomness:</label
          >
          <select
            id="temperatureSelect"
            class="px-3 py-1.5 border border-gray-300 rounded bg-white"
          >
            <option value="0.1">Very Conservative</option>
            <option value="0.5">Conservative</option>
            <option value="0.8" selected>Balanced</option>
            <option value="1.0">Creative</option>
            <option value="1.5">Very Creative</option>
          </select>
        </div>

        <!-- AI Mode Control -->
        <div class="flex items-center gap-2">
          <label for="aiModeSelect" class="text-gray-800 font-medium"
            >AI Engine:</label
          >
          <select
            id="aiModeSelect"
            class="px-3 py-1.5 border border-gray-300 rounded bg-white"
          >
            <option value="homegrown">Homegrown AI</option>
            <option value="stockfish">Stockfish Engine</option>
          </select>
        </div>

        <!-- Game Mode Control -->
        <div class="flex items-center gap-2">
          <label for="gameModeSelect" class="text-gray-800 font-medium"
            >Game Mode:</label
          >
          <select
            id="gameModeSelect"
            class="px-3 py-1.5 border border-gray-300 rounded bg-white"
          >
            <option value="humanVsAI">Human vs AI</option>
            <option value="AIvsAI">AI vs AI</option>
            <option value="humanVsHuman">Human vs Human</option>
          </select>
        </div>
      </div>

      <canvas id="chessboard" class="bg-white shadow-md"></canvas>
    </div>
    <div
      class="promotion-dialog hidden fixed flex flex-col bg-white border-2 border-gray-800 rounded-lg shadow-lg w-30"
    >
      <button
        class="w-full px-4 py-2 border-b border-gray-200 bg-white text-gray-800 hover:bg-green-500 hover:text-white transition-colors duration-200"
        onclick="window.chessGame.promotePawn('queen')"
      >
        Queen
      </button>
      <button
        class="w-full px-4 py-2 border-b border-gray-200 bg-white text-gray-800 hover:bg-green-500 hover:text-white transition-colors duration-200"
        onclick="window.chessGame.promotePawn('rook')"
      >
        Rook
      </button>
      <button
        class="w-full px-4 py-2 border-b border-gray-200 bg-white text-gray-800 hover:bg-green-500 hover:text-white transition-colors duration-200"
        onclick="window.chessGame.promotePawn('bishop')"
      >
        Bishop
      </button>
      <button
        class="w-full px-4 py-2 bg-white text-gray-800 hover:bg-green-500 hover:text-white transition-colors duration-200"
        onclick="window.chessGame.promotePawn('knight')"
      >
        Knight
      </button>
    </div>
    <script type="module" src="./chess.js"></script>
  </body>
</html>
